<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>叮——</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff7f0; font-family: "Segoe UI", "PingFang SC", sans-serif; }
      #hud {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.88); color: #5a3d3a; padding: 10px 16px; border-radius: 16px;
        font-size: 14px; z-index: 2; max-width: 92vw; text-align: center;
        box-shadow: 0 6px 18px rgba(244, 167, 185, 0.25); border: 2px solid rgba(244, 167, 185, 0.45);
      }
      #msg {
        position: fixed; left: 50%; top: 56px; transform: translateX(-50%);
        color: #7a5560; font-size: 13px; z-index: 2; background: rgba(255,255,255,0.82);
        padding: 6px 12px; border-radius: 12px; min-height: 1.2em;
      }
      #day-bar {
        position: fixed; left: 50%; top: 88px; transform: translateX(-50%);
        width: min(420px, 86vw); height: 8px; border-radius: 999px; z-index: 2;
        background: rgba(255,255,255,0.55); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(120,80,40,0.15);
      }
      #day-bar-fill {
        height: 100%; width: 0%; background: linear-gradient(90deg, #8fcfc0, #f4a7b9);
        transition: width 0.2s linear;
      }
      #day-bar::before, #day-bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(90,60,30,0.28); z-index: 1;
      }
      #day-bar::before { left: 28%; }
      #day-bar::after { left: 62%; }
      #wave-chip {
        position: fixed; left: 50%; top: 102px; transform: translateX(-50%);
        font-size: 12px; color: #6a4a32; z-index: 2; background: rgba(255,255,255,0.7);
        padding: 2px 10px; border-radius: 999px;
      }
      #goal-bar {
        position: fixed; left: 50%; top: 128px; transform: translateX(-50%);
        width: min(280px, 70vw); height: 6px; border-radius: 999px; z-index: 2;
        background: rgba(255,255,255,0.5); overflow: hidden;
      }
      #goal-bar-fill {
        height: 100%; width: 0%; background: linear-gradient(90deg, #8fcfc0, #f2c14e);
        transition: width 0.25s ease;
      }
      #goal-bar.met #goal-bar-fill { background: linear-gradient(90deg, #f4a7b9, #f2c14e); }
      #tip-jar {
        position: fixed; left: 12px; top: 12px; z-index: 2;
        background: rgba(255,255,255,0.92); color: #5a3d3a; border-radius: 16px;
        padding: 8px 12px; font-size: 13px; line-height: 1.4;
        box-shadow: 0 4px 14px rgba(244, 167, 185, 0.22); border: 2px solid rgba(143, 207, 192, 0.45);
      }
      #tip-jar strong { color: #f4a7b9; }
      #floats {
        position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden;
      }
      .float-cue {
        position: absolute; left: 50%; top: 48%; transform: translate(-50%, 0);
        font-size: 22px; font-weight: 700; color: #d4a017;
        animation: floatUp 1.1s ease-out forwards;
        text-shadow: 0 2px 0 rgba(255,255,255,0.8);
      }
      .float-cue.sad { color: #a06050; font-size: 18px; }
      .float-cue.goal { color: #e85d4c; font-size: 26px; }
      .float-cue.buy { color: #508cdc; font-size: 20px; }
      #shop-panel {
        display: none; position: fixed; right: 12px; top: 12px; z-index: 6;
        width: min(220px, 46vw); background: rgba(255,255,255,0.95); color: #5a3d3a;
        border-radius: 18px; padding: 10px 12px; box-shadow: 0 8px 22px rgba(244, 167, 185, 0.22);
        font-size: 12px; border: 2px solid rgba(244, 167, 185, 0.4);
      }
      #shop-panel.open { display: block; }
      #shop-panel h3 { margin: 0 0 8px; font-size: 13px; }
      .shop-item {
        display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px;
        padding-bottom: 8px; border-bottom: 1px solid rgba(120,80,40,0.12);
      }
      .shop-item:last-child { margin-bottom: 0; border-bottom: 0; padding-bottom: 0; }
      .shop-item button {
        margin-top: 4px; border: 0; border-radius: 999px; padding: 6px 8px; cursor: pointer;
        background: #f4a7b9; color: #fff; font-size: 12px;
      }
      .shop-item button:disabled { background: #e5d0d6; cursor: default; }
      .shop-item .meta { color: #7a5538; }
      @keyframes floatUp {
        0% { opacity: 0; transform: translate(-50%, 12px) scale(0.9); }
        15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -48px) scale(1.05); }
      }
      #hint {
        position: fixed; left: 12px; bottom: 12px; color: #4a3728; font-size: 13px; z-index: 2;
        background: rgba(255,255,255,0.7); padding: 8px 10px; border-radius: 8px; line-height: 1.5;
      }
      #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
      .bubble {
        position: absolute; transform: translate(-50%, -100%);
        background: #fff; color: #5a3d3a; border: 2px solid #f4a7b9; border-radius: 16px;
        padding: 6px 8px 5px; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 12px rgba(244,167,185,0.25);
        min-width: 88px; text-align: center;
      }
      .bubble .patience {
        margin-top: 4px; height: 4px; border-radius: 999px; background: #ffe8ef; overflow: hidden;
      }
      .bubble .patience > i {
        display: block; height: 100%; width: 100%; background: #8fcfc0; border-radius: 999px;
      }
      .bubble .patience.low > i { background: #f4a7b9; }
      .bubble::after {
        content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
        border: 6px solid transparent; border-top-color: #f4a7b9; border-bottom: 0;
      }
      #bake-modal, #settle-modal {
        display: none; position: fixed; inset: 0; z-index: 5;
        background: rgba(40, 28, 18, 0.45); align-items: center; justify-content: center;
      }
      #bake-modal.open, #settle-modal.open { display: flex; }
      #bake-card, #settle-card {
        width: min(380px, 92vw); background: #fffaf7; border-radius: 22px; padding: 20px 18px 16px;
        box-shadow: 0 12px 40px rgba(244, 167, 185, 0.28); color: #5a3d3a; text-align: center;
        border: 2px solid rgba(244, 167, 185, 0.35);
      }
      #bake-card h2, #settle-card h2 { margin: 0 0 8px; font-size: 20px; }
      #bake-progress, #settle-line { font-size: 13px; color: #7a5a40; margin-bottom: 14px; line-height: 1.5; }
      #settle-stars { font-size: 28px; letter-spacing: 2px; margin: 8px 0 12px; color: #d4a017; }
      #settle-meta { font-size: 13px; color: #6a4a32; margin-bottom: 16px; }
      #bake-steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
      .bake-step {
        font-size: 12px; padding: 6px 10px; border-radius: 999px; background: #efe0cc; color: #7a5a40;
      }
      .bake-step.done { background: #c8e6c0; color: #2f5d2f; }
      .bake-step.current { background: #ffd27a; color: #5a3d10; font-weight: 700; }
      #bake-action, #settle-again {
        border: 0; background: #f4a7b9; color: #fff; font-size: 16px; padding: 12px 18px;
        border-radius: 999px; cursor: pointer; width: 100%;
      }
      #bake-action:hover, #settle-again:hover { background: #e892a8; }
      #bake-cancel, #settle-reset {
        margin-top: 8px; border: 0; background: transparent; color: #9a7a80; cursor: pointer; font-size: 13px;
      }
      #mute-btn {
        position: fixed; right: 12px; bottom: 160px; z-index: 4;
        border: 0; border-radius: 14px; padding: 10px 12px; font-size: 13px;
        background: rgba(143, 207, 192, 0.95); color: #fff; cursor: pointer;
      }
      #touch-seats { display: flex; gap: 6px; }
      .touch-btn {
        border: 0; border-radius: 16px; padding: 12px 14px; font-size: 15px; color: #fff;
        background: rgba(244, 167, 185, 0.95); box-shadow: 0 4px 14px rgba(244, 167, 185, 0.35);
        min-width: 72px; touch-action: manipulation;
      }
      .touch-btn.secondary { background: rgba(143, 207, 192, 0.95); }
      .touch-btn:active { transform: scale(0.97); }
      #title-splash {
        position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background:
          linear-gradient(180deg, rgba(255,247,240,0.72), rgba(255,232,239,0.82)),
          url('/art/direction-locked.png') center / cover no-repeat;
        pointer-events: auto;
      }
      #title-splash.hidden { display: none !important; }
      #title-card {
        text-align: center; color: #5a3d3a; padding: 28px 32px; border-radius: 28px;
        background: rgba(255, 255, 255, 0.9); box-shadow: 0 18px 50px rgba(244, 167, 185, 0.28);
        max-width: min(420px, 92vw); border: 2px solid rgba(244, 167, 185, 0.4);
      }
      #title-card .brand {
        font-size: clamp(42px, 9vw, 64px); font-weight: 800; letter-spacing: 0.08em; margin: 0 0 8px;
        color: #e892a8;
      }
      #title-card .sub { margin: 0 0 18px; font-size: 15px; color: #8a6a70; line-height: 1.5; }
      #title-start {
        border: 0; background: #f4a7b9; color: #fff; font-size: 18px; padding: 12px 28px;
        border-radius: 999px; cursor: pointer; box-shadow: 0 8px 20px rgba(244, 167, 185, 0.45);
        position: relative; z-index: 11; pointer-events: auto;
      }
      #title-start:hover { background: #e892a8; }
      #coach {
        display: none; position: fixed; left: 16px; top: 160px; z-index: 6;
        width: min(280px, 78vw); background: rgba(255,248,239,0.95); color: #4a2f1c;
        border-radius: 14px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(90,50,20,0.16);
        font-size: 13px; line-height: 1.55;
      }
      #coach.open { display: block; }
      #coach h3 { margin: 0 0 6px; font-size: 14px; }
      #coach ol { margin: 0 0 8px; padding-left: 18px; }
      #coach-skip {
        border: 0; background: transparent; color: #8a6a50; cursor: pointer; font-size: 12px; padding: 0;
      }
      @media (min-width: 900px) {
        #touch-bar { opacity: 0.92; }
      }
    </style>
  </head>
  <body>
    <div id="title-splash">
      <div id="title-card">
        <p class="brand">叮——</p>
        <p class="sub">一间暖烘烘的小烘焙店<br/>摆好座位，接单，听烤箱响一声</p>
        <button id="title-start" type="button" onclick="document.getElementById('title-splash')?.classList.add('hidden')">开始营业准备</button>
      </div>
    </div>
    <div id="hud">《叮——》加载中…</div>
    <div id="msg"></div>
    <div id="day-bar"><div id="day-bar-fill"></div></div>
    <div id="wave-chip">准备 · 早市</div>
    <div id="goal-bar"><div id="goal-bar-fill"></div></div>
    <div id="tip-jar">小费罐 <strong id="tip-total">0</strong><br/><span id="tip-today">今日 0</span></div>
    <div id="shop-panel">
      <h3>小费布置店面</h3>
      <div id="shop-list"></div>
    </div>
    <div id="floats"></div>
    <div id="coach">
      <h3>第一天小纸条</h3>
      <ol>
        <li>点座位 1/2/3 摆桌</li>
        <li>开业后点客人接单</li>
        <li>烤箱做好再送回——耐心高小费多</li>
      </ol>
      <button id="coach-skip" type="button">知道了</button>
    </div>
    <div id="hint">
      手机可点右侧按钮；电脑仍可用键盘与点击<br/>
      点客人/烤箱会自动走到并互动
    </div>
    <div id="bubbles"></div>
    <button id="mute-btn" type="button">静音</button>
    <div id="touch-bar">
      <div id="touch-seats">
        <button class="touch-btn secondary" type="button" data-seat="0">座位1</button>
        <button class="touch-btn secondary" type="button" data-seat="1">座位2</button>
        <button class="touch-btn secondary" type="button" data-seat="2">座位3</button>
      </div>
      <button class="touch-btn" id="touch-interact" type="button">互动</button>
      <button class="touch-btn" id="touch-primary" type="button">开业</button>
      <button class="touch-btn secondary" id="touch-cancel" type="button">取消制作</button>
    </div>
    <div id="bake-modal">
      <div id="bake-card">
        <h2 id="bake-title">制作中</h2>
        <div id="bake-progress"></div>
        <div id="bake-steps"></div>
        <button id="bake-action" type="button">下一步</button>
        <button id="bake-cancel" type="button">取消制作</button>
      </div>
    </div>
    <div id="settle-modal">
      <div id="settle-card">
        <h2>今日打烊</h2>
        <div id="settle-stars">★★★☆☆</div>
        <div id="settle-line"></div>
        <div id="settle-meta"></div>
        <button id="settle-again" type="button">再来一天（保留座位）</button>
        <button id="settle-reset" type="button">重新摆座开新店</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
